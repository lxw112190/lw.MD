name: Windows CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build Windows x64
    # Pin VS2022: windows-latest moved to the VS2026 runner image in 2026.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify synchronized version metadata
        shell: pwsh
        run: |
          $cmake = Get-Content -LiteralPath "CMakeLists.txt" -Raw
          if ($cmake -notmatch 'project\(lw_MD VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Cannot read project version from CMakeLists.txt"
          }
          $projectVersion = $Matches[1]
          $rootVersion = (Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json).version
          $frontendVersion = (Get-Content -LiteralPath "app/package.json" -Raw | ConvertFrom-Json).version
          $versionResource = Get-Content -LiteralPath "resources/version.rc" -Raw
          if ($versionResource -notmatch 'VALUE\s+"FileVersion",\s+"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Cannot read FileVersion from resources/version.rc"
          }
          $fileVersion = $Matches[1]
          if ($versionResource -notmatch 'VALUE\s+"ProductVersion",\s+"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Cannot read ProductVersion from resources/version.rc"
          }
          $productVersion = $Matches[1]
          if ($versionResource -notmatch 'FILEVERSION\s+([0-9]+),([0-9]+),([0-9]+),0') {
            throw "Cannot read numeric FILEVERSION from resources/version.rc"
          }
          $numericFileVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          if ($versionResource -notmatch 'PRODUCTVERSION\s+([0-9]+),([0-9]+),([0-9]+),0') {
            throw "Cannot read numeric PRODUCTVERSION from resources/version.rc"
          }
          $numericProductVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $versions = @($projectVersion, $rootVersion, $frontendVersion, $fileVersion, $productVersion, $numericFileVersion, $numericProductVersion) | Select-Object -Unique
          if ($versions.Count -ne 1) {
            throw "Version metadata is inconsistent: CMake=$projectVersion root=$rootVersion frontend=$frontendVersion file=$fileVersion product=$productVersion numericFile=$numericFileVersion numericProduct=$numericProductVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', '' -replace '-.*$', ''
            if ($tagVersion -ne $projectVersion) {
              throw "Tag version $tagVersion does not match project version $projectVersion"
            }
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Check frontend
        run: npm run check

      - name: Configure native build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create portable package
        shell: pwsh
        run: |
          $packageDirectory = "artifacts/package"
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
          Copy-Item -LiteralPath "build/Release/lw.MD.exe" -Destination $packageDirectory
          Copy-Item -LiteralPath "README.md" -Destination $packageDirectory
          Copy-Item -LiteralPath "README_EN.md" -Destination $packageDirectory
          Copy-Item -LiteralPath "LICENSE" -Destination $packageDirectory
          Copy-Item -LiteralPath "THIRD_PARTY_NOTICES.md" -Destination $packageDirectory
          New-Item -ItemType Directory -Force -Path "$packageDirectory/docs" | Out-Null
          Copy-Item -LiteralPath "docs/assets" -Destination "$packageDirectory/docs" -Recurse

          $exeHash = (Get-FileHash -LiteralPath "$packageDirectory/lw.MD.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  lw.MD.exe" | Out-File -LiteralPath "$packageDirectory/lw.MD.exe.sha256" -Encoding ascii

          Compress-Archive -Path "$packageDirectory/*" -DestinationPath "artifacts/lw.MD-windows-x64.zip" -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath "artifacts/lw.MD-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  lw.MD-windows-x64.zip" | Out-File -LiteralPath "artifacts/lw.MD-windows-x64.zip.sha256" -Encoding ascii

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: lw.MD-windows-x64
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: lw.MD-release-assets
          path: |
            artifacts/lw.MD-windows-x64.zip
            artifacts/lw.MD-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: lw.MD-release-assets
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/lw.MD-windows-x64.zip \
            release-assets/lw.MD-windows-x64.zip.sha256 \
            --verify-tag \
            --generate-notes \
            --title "lw.MD $GITHUB_REF_NAME" \
            "${prerelease[@]}"
